name: Publish Polish questionnaire DOCX (one-time)

on:
  push:
    branches: [main]
    paths:
      - "tools/export_questionnaire_docx.py"
      - ".github/workflows/publish-pl-docx.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install document export
        run: python -m pip install python-docx==1.2.0
      - name: Generate Polish questionnaire
        run: python tools/export_questionnaire_docx.py
      - name: Commit generated Word document
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instruments/dera_hri_v3_pl.docx
          if ! git diff --cached --quiet; then
            git commit -m "docs: add Polish DERA-HRI v3 questionnaire DOCX"
            git push origin HEAD:main
          fi
